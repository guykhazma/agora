name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
  workflow_run:
    workflows: ["Crawl & Enrich"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel any queued deploy if a newer one comes in
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate derived site data (index.json + feed.xml)
        # Pure-stdlib; builds slim per-project index + RSS feed from proposals.json.
        # Regenerated on every deploy so the site stays fast and the feed stays fresh.
        run: python scripts/build_site_data.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # Reproducible install from the committed lockfile.
        run: npm ci

      - name: Copy data into frontend public
        run: |
          # Remove symlink if present (local dev uses a symlink; CI needs real files)
          rm -f frontend/public/data
          mkdir -p frontend/public/data
          cp -r data/. frontend/public/data/

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Set this repo variable if deploying to a subpath e.g. /agora/
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
