# Reads data/health.json (written by the crawler) and opens/updates a GitHub issue
# when any project or source has gone stale or is failing — so an unattended pipeline
# tells the owner it needs attention instead of silently rotting.
name: Health Check

on:
  schedule:
    # ~2h after the daily crawl (crawl runs at 06:00 UTC) so health.json is fresh.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate crawl health
        id: health
        run: |
          set +e
          REPORT="$(python scripts/check_health.py)"
          CODE=$?
          echo "$REPORT"
          {
            echo 'report<<EOF'
            echo "$REPORT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "unhealthy=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update alert issue
        if: steps.health.outputs.unhealthy == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.health.outputs.report }}
        run: |
          TITLE="🔴 Agōra crawl health alert"
          BODY="$REPORT

          _Auto-generated by the Health Check workflow. Resolve the underlying source failures, then close this issue — it will reopen/comment if problems persist._"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "health" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail the run if unhealthy
        if: steps.health.outputs.unhealthy == '1'
        run: |
          echo "::error::Crawl health check found stale or failing sources — see the run summary and the alert issue."
          exit 1
