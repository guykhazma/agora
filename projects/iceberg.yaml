id: iceberg
name: Apache Iceberg
description: Open table format for huge analytic datasets
# Public image URL (SVG/PNG). Shown in the app; clicking the logo opens `website` (or GitHub if no site).
logo: https://iceberg.apache.org/assets/images/Iceberg-logo.svg
website: https://iceberg.apache.org
repo: apache/iceberg
slack:
  url: https://the-asf.slack.com/archives/CX3QPHTF3
  channel: "#iceberg"

# Mailing list (Apache Pony Mail)
mailing_list:
  address: dev@iceberg.apache.org
  pony_mail_list: dev
  pony_mail_domain: iceberg.apache.org
  # When crawl state is empty or you pass --reset: fetch list months from here through today.
  # Incremental runs only scan from last_crawled_at’s month → now (fast).
  history_start: "2020-01"

# GitHub crawl config
github:
  repo: apache/iceberg
  proposal_labels:
    - kind/proposal
    - kind/spec
    - type/feature-request
  title_prefixes:
    - "[DISCUSS]"
    - "[PROPOSAL]"
    - "[RFC]"
    - "[SPEC]"

# YouTube community syncs — no API key needed, uses public RSS feed
# Channel: https://www.youtube.com/@ApacheIceberg
youtube:
  channel_id: UCAg-s6wxgQRmEBohfuWTEXA
  max_videos: 50
  keywords:
    - community sync
    - office hours
    - release
    - summit
    - iceberg

# Known community sync / design docs to always crawl as first-class items
# These are fetched, LLM-summarized, and appear in the dashboard alongside proposals
known_docs:
  - url: https://docs.google.com/document/d/19nno1RoPznbbxKOZZddZNHHafa7XULjbN6RPExdr2n4
    title: "Iceberg Spark Community Sync Notes"
  # General community sync — add URL once known
  # - url: https://docs.google.com/document/d/...
  #   title: "Iceberg General Community Sync Notes"

# GitHub Discussions (same repo as github.repo)
github_discussions:
  repo: apache/iceberg

# Community calendars — two public Google Calendars for Iceberg events
calendars:
  - name: "Iceberg Dev Events"
    ics_url: "https://calendar.google.com/calendar/ical/3905d492f1b450ba0712f2ae6afa76eb757f13d85220cc03aa4527885adc5629%40group.calendar.google.com/public/basic.ics"
    url: "https://calendar.google.com/calendar/u/0/r?cid=MzkwNWQ0OTJmMWI0NTBiYTA3MTJmMmFlNmFmYTc2ZWI3NTdmMTNkODUyMjBjYzAzYWE0NTI3ODg1YWRjNTYyOUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  - name: "Iceberg Community"
    ics_url: "https://calendar.google.com/calendar/ical/593bb00bfe457d319141350dd24c964f39bdbd9fd243281a8632a00963a21d86%40group.calendar.google.com/public/basic.ics"
    url: "https://calendar.google.com/calendar/u/0?cid=NTkzYmIwMGJmZTQ1N2QzMTkxNDEzNTBkZDI0Yzk2NGYzOWJkYmQ5ZmQyNDMyODFhODYzMmEwMDk2M2EyMWQ4NkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"

# Tags for categorizing proposals
components:
  - core
  - spark
  - flink
  - python
  - rust
  - hive
  - aws
  - azure
  - gcp
