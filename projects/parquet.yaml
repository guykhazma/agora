id: parquet
name: Apache Parquet
description: Columnar storage format for efficient analytic data
# Public image URL (SVG/PNG). Shown in the app; clicking the logo opens `website`.
logo: https://raw.githubusercontent.com/apache/parquet-format/master/logo/parquet-logos_1.svg
website: https://parquet.apache.org
repo: apache/parquet-java

# Mailing list (Apache Pony Mail).
# Parquet's dev@ list is lower volume, but we still keep it to governance threads so
# the dashboard stays proposal-focused. Drop `thread_prefixes` to ingest everything.
mailing_list:
  address: dev@parquet.apache.org
  pony_mail_list: dev
  pony_mail_domain: parquet.apache.org
  thread_prefixes:
    - "[VOTE]"
    - "[DISCUSS]"
    - "[PROPOSAL]"
    - "[RESULT]"
    - "[ANNOUNCE"
  history_start: "2021-01"

# GitHub crawl config.
# apache/parquet-java (formerly parquet-mr) is the Java implementation and the main
# development repo; the format spec + proposals live in apache/parquet-format and are
# discussed on the mailing list above. Releases & milestones come from parquet-java.
github:
  repo: apache/parquet-java
  proposal_labels:
    - proposal
    - enhancement
  title_prefixes:
    - "[PROPOSAL]"
    - "[DISCUSS]"

# Tags for categorizing proposals
components:
  - format
  - java
  - encoding
  - encryption
  - compression
  - bloom-filter
  - cli
